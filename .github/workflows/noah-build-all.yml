name: Noah build (Linux + Windows)

# Builds the local-build branch for Linux and Windows on GitHub-hosted runners.
# Unsigned, no T3 Connect config, no release: download the artifacts from the run.
on:
  push:
    branches: [noah/build-all]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build_bundle:
    name: Build JS bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...
      - run: node scripts/update-release-package-versions.ts 0.0.46
      - run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config
      - run: vp run build:desktop
      - uses: actions/upload-artifact@v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  linux_x64:
    needs: [build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: 0.0.46
      ref: ${{ github.sha }}
      release_channel: latest
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: Linux x64
      runner: ubuntu-24.04
      platform: linux
      target: AppImage
      arch: x64
      rust_target: x86_64-unknown-linux-gnu
      resource_key: linux-x64
      cli_archive: true

  win_x64:
    needs: [build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: 0.0.46
      ref: ${{ github.sha }}
      release_channel: latest
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: Windows x64
      runner: windows-2025
      platform: win
      target: nsis
      arch: x64
      rust_target: x86_64-pc-windows-msvc
      resource_key: win32-x64
      cli_archive: false
